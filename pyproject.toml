[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cougar-rgb"
dynamic = ["version"]
description = "Linux control for ARGB case lighting driven by Gigabyte RGB Fusion 2 USB controllers"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]
keywords = ["rgb", "argb", "gigabyte", "rgb-fusion", "led", "linux"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cougar-rgb = "cougar_rgb.cli:main"

[tool.setuptools]
packages = ["cougar_rgb"]

[tool.setuptools.dynamic]
version = { attr = "cougar_rgb.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
